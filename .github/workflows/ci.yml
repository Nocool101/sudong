name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest   # net7.0-windows / WPF 需 Windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test (单元测试)
        # WPF 窗口类测试由 tests/WpfTestHost.cs 提供唯一 STA 线程 + 已加载 App.xaml 资源的
        # Application 实例，可在无头 CI 中稳定运行，因此不再排除任何测试类。
        run: dotnet test --configuration Release --no-build
