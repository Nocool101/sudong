name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: windows-latest   # net7.0-windows / WPF 需 Windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '7.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Test (稳定单元测试)
        # 排除需 UI/Application 或无头环境不稳定的测试：
        # WindowXamlLoadTests / ReproTests / AutoNameTests
        run: dotnet test --configuration Release --no-build --filter "FullyQualifiedName!~WindowXamlLoadTests&FullyQualifiedName!~ReproTests&FullyQualifiedName!~AutoNameTests"
